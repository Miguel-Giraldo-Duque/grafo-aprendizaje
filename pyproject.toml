[project]
name = "grafo-aprendizaje"
version = "0.1.0"
description = "Grafo léxico personal: Neo4j, ungraph y un servidor FastMCP."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ungraph==0.1.5",
    "fastmcp==4.1.8",
    "neo4j>=5.28.2,<6",
    "python-dotenv>=1.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
]

[project.scripts]
grafo-ingerir = "grafo_aprendizaje.cli:main"
grafo-mcp = "grafo_aprendizaje.mcp_server:main"
grafo-exportar = "grafo_aprendizaje.export_graph:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grafo_aprendizaje"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
