# Neo4j 5.26 Community. La contraseña sale de .env (NEO4J_PASSWORD).
# Los datos quedan en ./data y las copias en ./dumps; ambos están en .gitignore.

services:
  neo4j:
    image: neo4j:5.26.31
    container_name: grafo-aprendizaje-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Define NEO4J_PASSWORD en .env}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m
      NEO4J_dbms_security_auth__minimum__password__length: "8"
    volumes:
      - ./data/neo4j:/data
      - ./dumps:/dumps
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "cypher-shell -a bolt://localhost:7687 -u neo4j -p \"$${NEO4J_AUTH#neo4j/}\" 'RETURN 1' || exit 1",
        ]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 40s
